<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Order Engine</title>
<style>
  :root { --tick: clamp(40px, 3.6vw, 72px); --violet: #8B5CF6; --gold: #FBBF24; --emerald: #34D399; --ink: #E2E8F0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05050B; color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; display: block; }
  .glass { background: rgba(9, 8, 20, .84);
    border: 1px solid rgba(139, 92, 246, .35); border-radius: 14px; }
  #title { position: fixed; left: 24px; top: 20px; pointer-events: none; }
  #title h1 { margin: 0; font-size: 20px; letter-spacing: .28em; font-weight: 600; }
  #phase { margin-top: 6px; font-size: 12px; letter-spacing: .22em; color: var(--violet); }
  #bank { position: fixed; right: 24px; top: 20px; padding: clamp(10px, .9vw, 22px) clamp(18px, 1.6vw, 38px); text-align: right; }
  #bank { transition: border-color .4s, box-shadow .4s; }
  #bank.hot { border-color: rgba(52, 211, 153, .75); box-shadow: 0 0 24px rgba(16, 185, 129, .28); }
  #bank small { display: block; font-size: clamp(10px, .8vw, 18px); letter-spacing: .2em; opacity: .6; }
  #money { font-size: clamp(24px, 2.2vw, 52px); font-variant-numeric: tabular-nums; color: var(--emerald); font-weight: 600; }
  #dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 24px calc(var(--tick) + 14px); display: flex; flex-direction: column;
    gap: 12px; pointer-events: none; box-sizing: border-box; }
  #dock .glass { pointer-events: auto; }
  #side { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; pointer-events: none; }
  #legend { padding: 12px 16px; width: 190px; flex: none; box-sizing: border-box; }
  #legend span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #legend div { display: flex; justify-content: space-between; gap: 18px; padding: 2px 0; }
  #legend .row { cursor: pointer; transition: opacity .2s; } #legend .row.off { opacity: .3; }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 8px; }
  #legend b { font-variant-numeric: tabular-nums; font-weight: 500; opacity: .8; }
  #ticker { width: clamp(240px, 27vw, 640px); font: clamp(11px, .9vw, 20px)/1.65 ui-monospace, Consolas, monospace;
    height: calc(6 * 1.65em + 20px); overflow: hidden; padding: 10px 14px; box-sizing: border-box; flex: none; }
  #ticker div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
  #bar { align-self: center; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;
    width: min(760px, 100%); box-sizing: border-box; }
  #scrubrow { display: flex; align-items: center; gap: 12px; font-size: 11px; letter-spacing: .18em; }
  #scrub { flex: 1; accent-color: var(--violet); }
  #stops { display: flex; justify-content: space-between; margin: -4px 52px 0; }
  #stops button { background: none; border: none; padding: 2px 4px; font-size: 10px; letter-spacing: .14em; opacity: .55; }
  #stops button.on { opacity: 1; color: var(--violet); }
  #btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button, label.btn { font: inherit; font-size: 12px; letter-spacing: .08em; color: var(--ink); cursor: pointer;
    background: rgba(139, 92, 246, .16); border: 1px solid rgba(139, 92, 246, .5); border-radius: 9px; padding: 8px 14px; }
  button:hover, label.btn:hover { background: rgba(139, 92, 246, .34); }
  button.primary { background: var(--violet); color: #0b0a18; font-weight: 700; border-color: transparent; }
  #rate { display: block; margin-top: 2px; font-size: clamp(10px, .75vw, 15px); letter-spacing: .08em; opacity: .85;
    font-variant-numeric: tabular-nums; min-height: 1.3em; }
  #rate.sync { color: var(--emerald); } #rate.off { color: #F87171; }
  #scroller { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tick); display: flex; z-index: 3;
    font-size: calc(var(--tick) * .5); background: linear-gradient(#0d3a8f, #061a45); border-top: 3px solid #F5C518;
    box-shadow: 0 -6px 24px rgba(0, 0, 0, .5); }
  #tag { display: flex; flex: none; align-items: stretch; font-weight: 800; letter-spacing: .03em; position: relative; z-index: 1; }
  #tag b { background: linear-gradient(#e11d3c, #9b0d24); color: #fff; padding: 0 .9em; display: flex; align-items: center; font-style: italic; }
  #tag span { background: #fff; color: #0d3a8f; padding: 0 .8em; display: flex; align-items: center; font-weight: 900; }
  #lane { flex: 1; overflow: hidden; position: relative; }
  #track { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: center; white-space: nowrap;
    font-weight: 700; color: #fff; text-shadow: 0 2px 3px rgba(0, 0, 0, .55); will-change: transform; }
  #track .it { padding-right: 1.1em; }
  #track .it::after { content: "\25C6"; color: #F5C518; margin-left: 1.1em; font-size: .7em; vertical-align: .1em; }
  #track .it.hot { color: #FFE066; } #track .it.hot i { font-style: normal; background: #C8102E; color: #fff; padding: 0 .4em; margin-right: .5em; border-radius: 3px; }
  #flows { --lift: clamp(12px, 1.5vw, 24px); display: flex; gap: clamp(8px, 1vw, 18px); justify-content: center; align-items: flex-end;
    align-self: center; max-width: 100%; padding-top: var(--lift); pointer-events: none; }
  #flows button { --c: #3B82F6; --y: 0px; pointer-events: auto; font-size: clamp(13px, 1.25vw, 24px); font-weight: 700; letter-spacing: .12em;
    padding: clamp(12px, 1.2vw, 22px) clamp(14px, 1.6vw, 32px); border-radius: 14px; border: 2px solid var(--c); color: #fff;
    background: color-mix(in srgb, var(--c) 24%, #0b0a18); white-space: nowrap;
    transform: translateY(var(--y)) rotate(-3deg); animation: rock 4.2s ease-in-out infinite alternate; }
  #flows button:hover { background: color-mix(in srgb, var(--c) 45%, #0b0a18); }
  #flows button.on { background: var(--c); color: #0b0a18; box-shadow: 0 0 28px var(--c); }
  #flows button[data-f="0"] { --c: #3B82F6; --y: calc(-1 * var(--lift)); }
  #flows button[data-f="1"] { --c: #EF4444; animation-delay: -1.1s; animation-duration: 4.9s; }
  #flows button[data-f="2"] { --c: #22C55E; animation-delay: -2.3s; animation-duration: 3.8s; }
  #flows button[data-f="3"] { --c: #FACC15; --y: calc(-1 * var(--lift)); animation-delay: -3.2s; animation-duration: 5.3s; }
  @keyframes rock { from { transform: translateY(var(--y)) rotate(-3deg); } to { transform: translateY(var(--y)) rotate(3deg); } }
  @media (prefers-reduced-motion: reduce) { #flows button { animation: none; transform: translateY(var(--y)); } }
  #flows kbd { font: inherit; opacity: .6; margin-right: 8px; }
  #shout { position: fixed; top: 44%; left: 16px; transform: translate(-130%, -50%); display: flex; align-items: center; gap: 10px;
    max-width: min(460px, 82vw); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1); pointer-events: none; z-index: 2; }
  #shout.right { left: auto; right: 16px; flex-direction: row-reverse; transform: translate(130%, -50%); }
  #shout.on, #shout.right.on { transform: translate(0, -50%); }
  #shout svg { width: clamp(84px, 9vw, 150px); height: auto; flex: none; }
  #shout.on svg { animation: rant .18s infinite alternate; }
  @keyframes rant { from { transform: rotate(-3deg); } to { transform: rotate(3deg) translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { #shout.on svg { animation: none; } }
  #bubble { padding: 10px 14px; border-radius: 14px; background: #F8FAFC; color: #0b0a18; font-weight: 700;
    font-size: clamp(13px, 1vw, 18px); line-height: 1.25; }
  #bubble small { display: block; font-size: .68em; letter-spacing: .14em; opacity: .6; margin-bottom: 2px; }
  @media (max-width: 720px) {
    #dock { padding: 0 12px calc(var(--tick) + 8px); gap: 8px; }
    #tag span { display: none; }
    #side { flex-direction: column; align-items: stretch; gap: 8px; }
    #legend { width: auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 14px; padding: 8px 12px; font-size: 12px; }
    #legend div { gap: 8px; } #legend div:last-child { display: none; }
    #ticker { width: auto; height: calc(2 * 1.65em + 16px); padding: 8px 12px; order: -1; } #ticker div:nth-child(n+3) { display: none; }
    #stops { margin: -4px 0 0; }
    #flows { align-self: stretch; } #flows button { flex: 1 1 0; padding-left: 4px; padding-right: 4px; } #flows kbd { display: none; }
    #title h1 { font-size: 13px; letter-spacing: .14em; } #phase { font-size: 10px; letter-spacing: .1em; max-width: 45vw; }
  }
  @media (max-height: 540px) { #legend, #ticker { display: none; } }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const N = 6000;
const STAGES = [
  { name: 'Concept', hex: '#818CF8' },
  { name: 'Spec',    hex: '#A855F7' },
  { name: 'Build',   hex: '#38BDF8' },
  { name: 'Revenue', hex: '#FBBF24' },
];

// ---------- file names: the particles are files ----------
const EXT = {
  2: ['js','ts','tsx','jsx','py','cpp','h','c','cs','go','rs','java','lua','json','yml','yaml','html','css','sh','ps1','sql','toml'],
  1: ['pdf','doc','docx','xls','xlsx','ppt','pptx','fig','drawio'],
};
function classify(name) {
  const n = name.toLowerCase();
  if (/(invoice|receipt|stripe|payout|payment|bank|tax|revenue|sales)/.test(n)) return 3;
  const ext = n.includes('.') ? n.split('.').pop() : '';
  if (EXT[2].includes(ext)) return 2;
  if (EXT[1].includes(ext) || /(spec|plan|brief|requirements|roadmap)/.test(n)) return 1;
  return 0;
}
function demoFiles() {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const pools = [
    () => `${pick(['idea','spark','note','sketch','voice-memo','screenshot','brainstorm'])}_${Math.floor(Math.random()*900+100)}.${pick(['md','txt','png','m4a'])}`,
    () => `${pick(['spec','brief','roadmap','requirements','plan'])}_${pick(['v1','v2','final','FINAL2'])}.${pick(['pdf','docx','xlsx'])}`,
    () => `${pick(['api','auth','checkout','worker','index','deploy','schema','ci'])}.${pick(['ts','py','yml','sql','tsx'])}`,
    () => `${pick(['invoice','stripe_payout','receipt','bank_statement'])}_${Math.floor(Math.random()*9000+1000)}.${pick(['pdf','csv'])}`,
  ];
  const weights = [0.38, 0.24, 0.26, 0.12], out = [];
  for (let i = 0; i < 900; i++) {
    let r = Math.random(), t = 0;
    while (r > weights[t]) { r -= weights[t]; t++; }
    out.push(pools[Math.min(t, 3)]());
  }
  return out;
}
let buckets = [[], [], [], []];

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'default' });
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#05050B');
scene.fog = new THREE.FogExp2(0x090814, 0.014);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 3, 23);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
controls.minDistance = 8; controls.maxDistance = 55;

// ---------- per-instance data ----------
const geo = new THREE.InstancedBufferGeometry();
const card = new THREE.BoxGeometry(0.2, 0.26, 0.03);
geo.index = card.index; geo.attributes.position = card.attributes.position; geo.attributes.normal = card.attributes.normal;
geo.instanceCount = N;

// lattice: N nearest grid points of an octahedron (a gem), sorted bottom to top
const S = 0.3, pts = [];
for (let i = -22; i <= 22; i++) for (let j = -22; j <= 22; j++) for (let k = -22; k <= 22; k++) {
  const d = Math.abs(i) + Math.abs(j) + Math.abs(k);
  if (d <= 19) pts.push([i, j, k, d + Math.random() * 0.01]);
}
pts.sort((a, b) => a[3] - b[3]); pts.length = N;
pts.sort((a, b) => a[1] - b[1] || Math.atan2(a[2], a[0]) - Math.atan2(b[2], b[0]));

const aChaos = new Float32Array(N * 3), aLattice = new Float32Array(N * 3), aBrain = new Float32Array(N * 3),
      aAxis = new Float32Array(N * 3), aMeta = new Float32Array(N * 4), aCrease = new Float32Array(N);
const rnd = (a = 1) => (Math.random() * 2 - 1) * a;
for (let i = 0; i < N; i++) {
  // chaos cloud
  const u = new THREE.Vector3(rnd(), rnd(), rnd()).normalize().multiplyScalar(3 + Math.pow(Math.random(), 0.6) * 9);
  aChaos.set([u.x * 1.25, u.y * 0.7 + 1.5, u.z], i * 3);
  aLattice.set([pts[i][0] * S, pts[i][1] * S + 1.2, pts[i][2] * S], i * 3);
  // a wrinkly two-lobed blob, for the "absorb" gag
  const b = new THREE.Vector3(rnd(), rnd(), rnd()).normalize();
  const w = 1 + 0.09 * Math.sin(9 * b.y + 3 * Math.sin(7 * b.z)) + 0.05 * Math.sin(13 * b.x * b.z);
  aCrease[i] = 0.5 - 0.5 * Math.sin(9 * b.y + 3 * Math.sin(7 * b.z));   // 1 = bottom of a fold
  const side = Math.sign(b.x) || 1;
  aBrain.set([b.x * 2.5 * w + side * 0.28, b.y * 2.3 * w + 1.5, b.z * 3.3 * w], i * 3);
  const ax = new THREE.Vector3(rnd(), rnd(), rnd()).normalize();
  aAxis.set([ax.x, ax.y, ax.z], i * 3);
  aMeta.set([0, Math.random(), Math.random() * Math.PI * 2, rnd()], i * 4);
}
geo.setAttribute('aChaos', new THREE.InstancedBufferAttribute(aChaos, 3));
geo.setAttribute('aLattice', new THREE.InstancedBufferAttribute(aLattice, 3));

// Four ordered "flow systems". Every one lists its points bottom to top, so the strata stay in pipeline order.
function makeForm(fn) {
  const a = new Float32Array(N * 3); let top = -1e9;
  for (let i = 0; i < N; i++) { const q = fn(i, i / (N - 1)); a.set([q[0], q[1] + 1.2, q[2]], i * 3); top = Math.max(top, q[1] + 1.2); }
  return { pts: a, apex: top + 0.15 };
}
const GOLDEN = 2.39996323;
const FORMS = [
  { name: 'STACK', pts: aLattice.slice(), apex: 1.2 + pts[N - 1][1] * S + 0.15 },
  { name: 'PIPELINE', ...makeForm((i, t) => {           // double helix
      const r = (2.3 + (((i >> 1) % 5) - 2) * 0.16) * Math.min(1, (1 - t) * 12 + 0.05), a = t * Math.PI * 14 + (i % 2) * Math.PI;
      return [Math.cos(a) * r, -4.95 + 9.9 * t, Math.sin(a) * r]; }) },
  { name: 'NETWORK', ...makeForm((i, t) => {            // sphere shell
      const y = -1 + 2 * t, r = Math.sqrt(Math.max(0, 1 - y * y)), a = i * GOLDEN;
      return [Math.cos(a) * r * 4.7, y * 4.7, Math.sin(a) * r * 4.7]; }) },
  { name: 'FUNNEL', ...makeForm((i, t) => {             // wide at the base, a point at the beam
      const r = 0.15 + 4.6 * Math.pow(1 - t, 1.6), a = i * GOLDEN;
      return [Math.cos(a) * r, -4.95 + 9.9 * t, Math.sin(a) * r]; }) },
];
geo.setAttribute('aLatticeB', new THREE.InstancedBufferAttribute(aLattice.slice(), 3));
geo.setAttribute('aBrain', new THREE.InstancedBufferAttribute(aBrain, 3));
geo.setAttribute('aAxis', new THREE.InstancedBufferAttribute(aAxis, 3));
geo.setAttribute('aCrease', new THREE.InstancedBufferAttribute(aCrease, 1));
const metaAttr = new THREE.InstancedBufferAttribute(aMeta, 4);
geo.setAttribute('aMeta', metaAttr);

const uniforms = {
  uTime: { value: 0 }, uP: { value: 0 }, uBrain: { value: 1 }, uSolo: { value: -1 }, uForm: { value: 0 },
  uCols: { value: STAGES.map(s => new THREE.Color(s.hex)) },
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: /* glsl */`
    attribute vec3 aChaos, aLattice, aLatticeB, aBrain, aAxis; attribute vec4 aMeta; attribute float aCrease;
    uniform float uTime, uP, uBrain, uSolo, uForm; uniform vec3 uCols[4];
    varying vec3 vCol; varying vec3 vN; varying vec3 vW; varying float vGlow, vPay, vOrder, vDim;
    mat3 rot(vec3 a, float t) { float c = cos(t), s = sin(t), o = 1. - c;
      return mat3(o*a.x*a.x+c, o*a.x*a.y+a.z*s, o*a.z*a.x-a.y*s,
                  o*a.x*a.y-a.z*s, o*a.y*a.y+c, o*a.y*a.z+a.x*s,
                  o*a.z*a.x+a.y*s, o*a.y*a.z-a.x*s, o*a.z*a.z+c); }
    float ease(float x) { x = clamp(x, 0., 1.); return x*x*(3. - 2.*x); }
    float back(float x) { x = clamp(x, 0., 1.); float k = x - 1.; return 1. + 2.70158*k*k*k + 1.70158*k*k; }
    void main() {
      float type = aMeta.x, seed = aMeta.y;
      float l2 = (uP - 1.) * 1.5 - seed * .5;
      float e1 = ease(uP * 1.5 - seed * .5), e2 = back(l2), e2c = clamp(e2, 0., 1.);
      const vec3 Y = vec3(0., 1., 0.);

      // 0: unsorted turbulence (or a borrowed brain)
      vec3 c = aChaos;
      c += .7 * vec3(sin(uTime*.7 + c.y*.8 + seed*6.), cos(uTime*.6 + c.z*.7 + seed*4.), sin(uTime*.5 + c.x*.9));
      c = rot(Y, uTime * .06 * (.5 + seed)) * (c - vec3(0., 1.5, 0.)) + vec3(0., 1.5, 0.);
      c = mix(aBrain, c, uBrain) + normalize(aBrain - vec3(0., 1.5, 0.)) * sin(uBrain * 3.14159) * 3.5;   // shatter burst

      // 1: sorting rings, one lane per kind
      float dir = mod(type, 2.) < .5 ? 1. : -1.;
      float r = 3.4 + type * 1.25 + aMeta.w * .32;
      float ang = aMeta.z + uTime * (.55 - type * .09) * dir;
      vec3 rp = vec3(cos(ang) * r, (fract(seed * 7.31) - .5) * .5, sin(ang) * r);
      rp = rot(vec3(1., 0., 0.), (type - 1.5) * .42) * rot(vec3(0., 0., 1.), (type - 1.5) * .2) * rp + vec3(0., 1.5, 0.);

      // 2: everything where it belongs
      mat3 spin = rot(Y, uTime * .18);
      vec3 la = mix(aLattice, aLatticeB, ease(uForm * 1.6 - seed * .6));   // morph between flow systems
      vec3 lp = spin * (la - vec3(0., 1.2, 0.)) + vec3(0., 1.2, 0.);

      vec3 p = mix(mix(c, rp, e1), lp, e2);
      float tumble = (1. - e2c) * (1. - .55 * e1) * mix(.15, 1., uBrain);
      vec3 local = rot(normalize(aAxis), tumble * (uTime * (1. + seed * 2.) + seed * 40.)) * position;
      vec3 nrm = rot(normalize(aAxis), tumble * (uTime * (1. + seed * 2.) + seed * 40.)) * normal;
      local = mix(local, spin * local, e2c); nrm = mix(nrm, spin * nrm, e2c);

      vec3 tc = type < .5 ? uCols[0] : type < 1.5 ? uCols[1] : type < 2.5 ? uCols[2] : uCols[3];
      float brainAmt = 1. - uBrain, sulci = smoothstep(.55, .92, aCrease);
      vec3 grey = mix(vec3(.30, .32, .40), mix(vec3(.40, .43, .50), vec3(.30, .30, .85), sulci), brainAmt);
      vCol = mix(grey, tc, e1);
      vGlow = smoothstep(.7, 1., l2) * (1. - smoothstep(1., 1.6, l2)) + brainAmt * sulci * .35;

// ---------- sound: a generated machine murmur, no audio files ----------
// A low filtered drone plus short blips on a 7-tone scale. Blips are random in chaos and fall into a
// repeating sequence as things get organized. Starts on the first click or key press (browsers require that).
let actx = null, master = null, soundOn = false, seqI = 0;
const sndBtn = document.getElementById('snd');
const note = n => 220 * Math.pow(2, n / 7), SEQ = [0, 2, 3, 5, 6, 5, 3, 2];
function startSound() {
  actx = new (window.AudioContext || window.webkitAudioContext)();

  const delay = actx.createDelay(1), fb = actx.createGain(), damp = actx.createBiquadFilter();
  delay.delayTime.value = 0.37; fb.gain.value = 0.5; damp.type = 'lowpass'; damp.frequency.value = 2200;
  master.connect(actx.destination); master.connect(delay); delay.connect(damp); damp.connect(fb); fb.connect(delay); damp.connect(actx.destination);
  const df = actx.createBiquadFilter(); df.type = 'lowpass'; df.frequency.value = 320; df.Q.value = 7; df.connect(master);
  [55, 55.6, 82.1, 110.3].forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain(); o.type = i % 2 ? 'sawtooth' : 'triangle'; o.frequency.value = f;
    g.gain.value = 0.16; o.connect(g); g.connect(df); o.start(); });
  const lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 200;

}

    blip(note(n), 0.05 + Math.random() * 0.12, Math.random() < 0.5 ? 'sine' : 'square', 0.04 + Math.random() * 0.04, 0.6 + Math.random() * 1.2);

    <ellipse cx="22" cy="106" rx="14" ry="10" fill="#4ade80"/><circle cx="14" cy="97" r="4.5" fill="#4ade80"/><circle cx="28" cy="97" r="4.5" fill="#4ade80"/><circle cx="14" cy="97" r="1.8" fill="#111"/><circle cx="28" cy="97" r="1.8" fill="#111"/>
    <rect x="2" y="78" width="16" height="26" rx="8" fill="#475569"/><path d="M10 104 V118" stroke="#475569" stroke-width="4"/></svg>`],
  ['BRICK FENTUS · LIVE', `<svg viewBox="0 0 120 120"><path d="M28 120 L44 96 H76 L92 120Z" fill="#1e293b"/><path d="M56 98 h8 l3 22 h-14z" fill="#b91c1c"/>
    <ellipse cx="60" cy="58" rx="30" ry="38" fill="#F1D3B8"/>
    <path d="M30 52 Q32 14 70 17 Q96 22 90 54 Q82 30 52 34 Q38 36 30 52Z" fill="#B58A5C"/>
    <path d="M40 55 h14 M66 53 h14" stroke="#2b2118" stroke-width="3" stroke-linecap="round"/>
    <path d="M42 63 h10 M68 63 h10" stroke="#111" stroke-width="4" stroke-linecap="round"/>

const shoutEl = document.getElementById('shout'), faceEl = document.getElementById('face'),
      bubbleEl = document.getElementById('bubble'), rateEl = document.getElementById('rate'),
      flowBtns = [...document.querySelectorAll('#flows button')];
const latA = geo.attributes.aLattice, latB = geo.attributes.aLatticeB;
let form = 0, formT = -1, regime = 0, regimeT = 0, regimeLen = 7, fillT = 2.5, shoutT = 0, who = 0, lastRate = '';
function setForm(f) {
  if (f === form) return;
  if (formT >= 0) { latA.array.set(latB.array); latA.needsUpdate = true; }     // finish a morph already under way
  latB.array.set(FORMS[f].pts); latB.needsUpdate = true; uniforms.uForm.value = 0; formT = 0; form = f;
  flowBtns.forEach((b, i) => b.classList.toggle('on', i === form));
  if (actx && soundOn) blip(90, 0.9, 'sawtooth', 0.07, 6);
}
flowBtns.forEach((b, i) => { b.onclick = () => setForm(i); b.classList.toggle('on', i === 0); });
// A bubble stays up for 150% of a deliberate read (3 words/s plus a 0.6 s lead-in); frog rants linger for the laugh.
const holdFor = t => Math.max(2.2, 1.5 * (0.6 + t.trim().split(/\s+/).length / 3) + (/FROG/i.test(t) ? 1.5 : 0));
let cuePending = false;
function shout(cue) {
  who = 1 - who;
  let text;
  if (cue) text = SHOUTS[regime][who];
  else {                                           // prefer a line that finishes before the next market shift
    const left = Math.max(3.5, regimeLen - regimeT + 1.5);
    for (let i = 0; i < 6; i++) { text = pick(FILLERS[who]); if (holdFor(text) <= left) break; }
  }
  shoutEl.classList.remove('on'); shoutEl.classList.toggle('right', who === 1); void shoutEl.offsetWidth;
  faceEl.innerHTML = FACES[who][1];
  bubbleEl.innerHTML = '<small>' + FACES[who][0] + '</small>' + text;
  shoutEl.classList.add('on');
  shoutT = holdFor(text);
  fillT = shoutT + 0.8 + Math.random() * 1.7;
}
function flashNews() { flashQ.push(NEWS[regime][Math.floor(Math.random() * 3)][1]); }

let dolly = 0, lastT = performance.now(), slowMs = 0, okFrames = 0, lastPhase = '', lastMoney = -1;
renderer.setAnimationLoop(() => {
  const now = performance.now(), elapsed = now - lastT;
  if (elapsed < 12) return;                        // 120 Hz screens draw at 60, 144 Hz at 72; 60 Hz is untouched
  lastT = now;
  const dt = Math.min(elapsed / 1000, 0.05);
  uniforms.uTime.value += dt;
  scrollTick(dt);

  // step quality down if frames stay slower than ~45 fps for about two seconds (never back up, to avoid flicker)
  if (elapsed < 250) {                             // ignore tab switches and stalls
    if (elapsed > 22) { slowMs += elapsed; okFrames = 0; } else if (++okFrames > 30) slowMs = 0;
    if (slowMs > 2000 && qStep < QUALITY_STEPS.length - 1) { qStep++; slowMs = 0; applySize(); }
  }

  if (brainT >= 0) {                       // hold the brain, shatter it, then organize the pieces
    brainT += dt;
    const k = Math.max(0, Math.min(1, (brainT - 1.6) / 0.9));
    uniforms.uBrain.value = 1 - Math.pow(1 - k, 3);
    if (brainT > 3.0) { brainT = -1; playing = true; }
  }
  if (playing) goal = null;
  if (goal !== null) { const d = goal - P;
    if (Math.abs(d) < 0.01) { setP(goal); goal = null; } else setP(P + Math.sign(d) * Math.min(Math.abs(d), dt * 1.1)); }
  if (playing) { setP(P + dt * (P < 2 ? 0.3 : 0.2)); if (P >= 3) playing = false; }
  uniforms.uP.value = P;

  const phase = brainT >= 0 ? (brainT < 1.6 ? 'LEGACY BRAIN DETECTED' : 'ABSORBING') :
    P < 0.02 ? 'ENTROPY' : P < 1 ? 'SORTING BY KIND' : P < 2 ? 'EVERYTHING WHERE IT BELONGS' : 'PAYING OUT';
  if (phase !== lastPhase) phaseEl.textContent = lastPhase = phase;

  if (formT >= 0) {                                 // morph to the chosen flow system
    formT += dt / 1.1; uniforms.uForm.value = Math.min(formT, 1);
    if (formT >= 1) { latA.array.set(latB.array); latA.needsUpdate = true; uniforms.uForm.value = 0; formT = -1; }
  }
  APEX += (FORMS[form].apex - APEX) * Math.min(1, dt * 3);
  const pay = THREE.MathUtils.smoothstep(P, 2.05, 2.6);
  const len = (vault.position.y - APEX) * pay;
  beam.scale.y = Math.max(len, 0.001); beam.position.y = APEX + len / 2;
  beam.material.opacity = pay * (0.7 + 0.3 * Math.sin(uniforms.uTime.value * 30));
  vault.material.color.copy(gold).multiplyScalar(0.25 + pay * 0.8);
  vault.rotation.z += dt * (0.3 + pay * 2);
  vault2.rotation.x += dt * (0.4 + pay * 2.2); vault2.rotation.y -= dt * (0.25 + pay * 1.4);
  const T = uniforms.uTime.value;
  for (let i = 0; i < SP; i++) { const d = spDir[i], life = (T * d[4] + d[3]) % 1, r = 1.5 + life * 2.6;
    spPos[i * 3] = d[0] * r; spPos[i * 3 + 1] = vault.position.y + d[1] * life * 2.2 - life * life * 2.4; spPos[i * 3 + 2] = d[2] * r; }
  spGeo.attributes.position.needsUpdate = true; sparks.material.opacity = pay > 0.5 ? pay : 0;
  bank.classList.toggle('hot', pay > 0.5);
  stops.forEach((b, i) => b.classList.toggle('on', Math.round(P) === i));
  // lift the view during the payout so the vault sits clear of the top edge
  const dy = (1.5 + 1.5 * THREE.MathUtils.smoothstep(P, 1.8, 2.6) - controls.target.y) * Math.min(1, dt * 3);
  controls.target.y += dy; camera.position.y += dy;
  // ...and pull back a little so the whole flow system clears the control bar
  const dz = (6 * THREE.MathUtils.smoothstep(P, 1.8, 2.6) - dolly) * Math.min(1, dt * 3);
  if (Math.abs(dz) > 1e-4) { const off = camera.position.clone().sub(controls.target); off.setLength(off.length() + dz); camera.position.copy(controls.target).add(off); dolly += dz; }
  // The market shifts every 11-17 seconds. The matching flow system pays 3x; any other pays 0.6x.
  const live = pay > 0.5 && (playing || P >= 2.99), mult = form === regime ? 3 : 0.6;
  if (live) {
    regimeT += dt; fillT -= dt;
    if (regimeT > regimeLen) { regime = (regime + 1 + Math.floor(Math.random() * 3)) % 4; regimeT = 0; regimeLen = 6 + Math.random() * 4; flashNews(); cuePending = true; }
    if (shoutT <= 0) { if (cuePending) { cuePending = false; shout(true); } else if (fillT <= 0) shout(false); }
    money += dt * 1400 * pay * mult;
  }
  if (shoutT > 0) { shoutT -= dt; if (shoutT <= 0 || !live) { shoutT = 0; shoutEl.classList.remove('on'); } }
  const rate = live ? '+$' + Math.round(1400 * mult).toLocaleString() + '/s · ' + (mult > 1 ? 'IN SYNC ×3' : 'OFF TREND') : '';
  if (rate !== lastRate) { lastRate = rate; rateEl.textContent = rate; rateEl.className = !live ? '' : mult > 1 ? 'sync' : 'off'; }
  const m = Math.floor(money); if (m !== lastMoney) { lastMoney = m; moneyEl.textContent = '$' + m.toLocaleString(); }

  if (P > 0.05 && (playing || pay > 0.5)) { tickAcc += dt; if (tickAcc > 0.16) { tickAcc = 0; tick(); } }

  controls.update();
  composer.render();
});

addEventListener('resize', applySize);
window.__engine = { uniforms, setP, renderer, setForm, shout, dur: () => shoutT, setRegime: r => { regime = r; regimeT = 0; flashNews(); cuePending = true; }, stats: () => ({ lowPower: LOW_POWER, renderScale, qStep, width: renderer.domElement.width, height: renderer.domElement.height }) };
